name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Field Notes site for GitHub Pages
        run: |
          mkdir -p dist
          cp -R public/. dist/
          cp public/field-notes-design.html dist/index.html
          test -s dist/index.html
          test -s dist/images/portfolio/app-dev-club.webp
          test -s dist/images/portfolio/replay-bitcamp.webp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
